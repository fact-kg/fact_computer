- is:
    type: computer/algorithm
- has:
    description:
      type: str
      value: "Find maximum element in an array"
- has:
    input_array:
      type: list
- has:
    i:
      type: math/variable
      as:
        - math/variable:
            description:
              value: "loop index"
- has:
    result:
      type: math/variable
      as:
        - math/variable:
            description:
              value: "the maximum element found so far"
- has:
    precondition:
      type: computer/algorithm/precondition
      as:
        - computer/algorithm/precondition:
            condition:
              value: "len(input_array) > 0"
- has:
    postcondition:
      type: computer/algorithm/postcondition
      as:
        - computer/algorithm/postcondition:
            condition:
              value: "result in input_array AND for all e in input_array: result >= e"
- has:
    step_init:
      type: computer/algorithm/assign
      as:
        - computer/algorithm/assign:
            description:
              value: "initialize result with first element"
            variable:
              value: result
            from:
              value: "input_array[0]"
            next:
              value: step_loop
- has:
    step_loop:
      type: computer/algorithm/indexed/for_each
      as:
        - computer/algorithm/indexed/for_each:
            description:
              value: "iterate over remaining elements"
            index:
              value: i
            from:
              value: 1
            to_length:
              value: input_array
            body:
              value: step_compare
            next:
              value: step_return
- has:
    loop_invariant:
      type: computer/algorithm/invariant
      as:
        - computer/algorithm/invariant:
            condition:
              value: "result in input_array[0..i] AND for all e in input_array[0..i]: result >= e"
- has:
    step_compare:
      type: computer/algorithm/if
      as:
        - computer/algorithm/if:
            description:
              value: "check if current element is greater than result"
            condition:
              value: math/algebra/operation/greater_than
            condition_args:
              value: ["input_array[i]", "result"]
            then:
              value: step_update
- has:
    step_update:
      type: computer/algorithm/assign
      as:
        - computer/algorithm/assign:
            description:
              value: "update result with new maximum"
            variable:
              value: result
            from:
              value: "input_array[i]"
- has:
    step_return:
      type: computer/algorithm/return
      as:
        - computer/algorithm/return:
            description:
              value: "return the maximum element"
            variable:
              value: result
