- is:
    type: computer/algorithm
- has:
    description:
      type: str
      value: "Merge two sorted arrays into a new sorted array"
- has:
    left:
      type: math/variable
      as:
        - math/variable:
            data_type:
              value: list
            description:
              value: "left sorted array"
- has:
    right:
      type: math/variable
      as:
        - math/variable:
            data_type:
              value: list
            description:
              value: "right sorted array"
- has:
    result:
      type: math/variable
      as:
        - math/variable:
            description:
              value: "merged sorted array"
- has:
    i:
      type: math/variable
      as:
        - math/variable:
            description:
              value: "index into left array"
- has:
    j:
      type: math/variable
      as:
        - math/variable:
            description:
              value: "index into right array"
- has:
    left_len:
      type: math/variable
      as:
        - math/variable:
            description:
              value: "length of left array bound"
- has:
    right_len:
      type: math/variable
      as:
        - math/variable:
            description:
              value: "length of right array bound"
- has:
    precondition:
      type: computer/algorithm/precondition
      as:
        - computer/algorithm/precondition:
            condition:
              value: "left is sorted AND right is sorted"
- has:
    postcondition:
      type: computer/algorithm/postcondition
      as:
        - computer/algorithm/postcondition:
            condition:
              value: "result is sorted AND len(result) == len(left) + len(right)"
- has:
    step_init_result:
      type: computer/algorithm/assign
      as:
        - computer/algorithm/assign:
            description:
              value: "create empty result array"
            variable:
              value: result
            from:
              value: "[]"
            next:
              value: step_init_i
- has:
    step_init_i:
      type: computer/algorithm/assign
      as:
        - computer/algorithm/assign:
            description:
              value: "initialize left index"
            variable:
              value: i
            from:
              value: 0
            next:
              value: step_init_j
- has:
    step_init_j:
      type: computer/algorithm/assign
      as:
        - computer/algorithm/assign:
            description:
              value: "initialize right index"
            variable:
              value: j
            from:
              value: 0
            next:
              value: step_compute_left_len
- has:
    step_compute_left_len:
      type: computer/algorithm/evaluate_expression
      as:
        - computer/algorithm/evaluate_expression:
            description:
              value: "compute left array length"
            expression_yaml:
              value: |
                math/algebra/operation/length:
                  - left
            result_variable:
              value: left_len
            next:
              value: step_compute_right_len
- has:
    step_compute_right_len:
      type: computer/algorithm/evaluate_expression
      as:
        - computer/algorithm/evaluate_expression:
            description:
              value: "compute right array length"
            expression_yaml:
              value: |
                math/algebra/operation/length:
                  - right
            result_variable:
              value: right_len
            next:
              value: step_merge_loop
- has:
    step_merge_loop:
      type: computer/algorithm/while
      as:
        - computer/algorithm/while:
            description:
              value: "while both arrays have elements"
            condition_yaml:
              value: |
                math/algebra/operation/and:
                  - math/algebra/operation/less_than:
                      - i
                      - left_len
                  - math/algebra/operation/less_than:
                      - j
                      - right_len
            body:
              value: step_compare
            next:
              value: step_drain_left
- has:
    step_compare:
      type: computer/algorithm/if
      as:
        - computer/algorithm/if:
            description:
              value: "pick smaller element"
            condition_yaml:
              value: |
                math/algebra/operation/less_equal:
                  - left[i]
                  - right[j]
            then:
              value: step_take_left
            else:
              value: step_take_right
- has:
    step_take_left:
      type: computer/algorithm/append
      as:
        - computer/algorithm/append:
            description:
              value: "take from left array"
            list:
              value: result
            value:
              value: "left[i]"
            next:
              value: step_inc_i
- has:
    step_inc_i:
      type: computer/algorithm/evaluate_expression
      as:
        - computer/algorithm/evaluate_expression:
            description:
              value: "advance left index"
            expression_yaml:
              value: |
                math/algebra/operation/add:
                  - i
                  - 1
            result_variable:
              value: i
- has:
    step_take_right:
      type: computer/algorithm/append
      as:
        - computer/algorithm/append:
            description:
              value: "take from right array"
            list:
              value: result
            value:
              value: "right[j]"
            next:
              value: step_inc_j
- has:
    step_inc_j:
      type: computer/algorithm/evaluate_expression
      as:
        - computer/algorithm/evaluate_expression:
            description:
              value: "advance right index"
            expression_yaml:
              value: |
                math/algebra/operation/add:
                  - j
                  - 1
            result_variable:
              value: j
- has:
    step_drain_left:
      type: computer/algorithm/while
      as:
        - computer/algorithm/while:
            description:
              value: "drain remaining left elements"
            condition_yaml:
              value: |
                math/algebra/operation/less_than:
                  - i
                  - left_len
            body:
              value: step_drain_left_append
            next:
              value: step_drain_right
- has:
    step_drain_left_append:
      type: computer/algorithm/append
      as:
        - computer/algorithm/append:
            description:
              value: "append remaining left element"
            list:
              value: result
            value:
              value: "left[i]"
            next:
              value: step_drain_left_inc
- has:
    step_drain_left_inc:
      type: computer/algorithm/evaluate_expression
      as:
        - computer/algorithm/evaluate_expression:
            description:
              value: "advance left index"
            expression_yaml:
              value: |
                math/algebra/operation/add:
                  - i
                  - 1
            result_variable:
              value: i
- has:
    step_drain_right:
      type: computer/algorithm/while
      as:
        - computer/algorithm/while:
            description:
              value: "drain remaining right elements"
            condition_yaml:
              value: |
                math/algebra/operation/less_than:
                  - j
                  - right_len
            body:
              value: step_drain_right_append
            next:
              value: step_return
- has:
    step_drain_right_append:
      type: computer/algorithm/append
      as:
        - computer/algorithm/append:
            description:
              value: "append remaining right element"
            list:
              value: result
            value:
              value: "right[j]"
            next:
              value: step_drain_right_inc
- has:
    step_drain_right_inc:
      type: computer/algorithm/evaluate_expression
      as:
        - computer/algorithm/evaluate_expression:
            description:
              value: "advance right index"
            expression_yaml:
              value: |
                math/algebra/operation/add:
                  - j
                  - 1
            result_variable:
              value: j
- has:
    step_return:
      type: computer/algorithm/return
      as:
        - computer/algorithm/return:
            description:
              value: "return merged sorted array"
            variable:
              value: result
