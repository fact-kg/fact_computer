- is:
    type: computer/algorithm
- has:
    description:
      type: str
      value: "Find maximum element in an array"
- has:
    input_array:
      type: list
- has:
    i:
      type: math/variable
      as:
        - math/variable:
            description:
              value: "loop index"
- has:
    result:
      type: math/variable
      as:
        - math/variable:
            description:
              value: "the maximum element found so far"
- has:
    rationale:
      type: computer/algorithm/rationale
      as:
        - computer/algorithm/rationale:
            rationale_yaml:
              value: |
                understanding:
                  problem: "find the largest element in a collection"
                  constraints: ["can compare two elements", "linear access to elements"]
                planning:
                  observation: "if I've seen all elements, I know which is largest"
                  insight: "keep track of the largest seen so far, update when a larger one appears"
                  question: "what is the initial value of the tracker?"
                  conclusion: "use the first element, then scan the rest"
                alternatives:
                  - name: "sort then take last"
                    tradeoff: "correct but O(n log n) instead of O(n)"
                  - name: "tournament/tree comparison"
                    tradeoff: "same O(n) but uses more memory"
- has:
    precondition:
      type: computer/algorithm/precondition
      as:
        - computer/algorithm/precondition:
            condition:
              value: "len(input_array) > 0"
- has:
    postcondition:
      type: computer/algorithm/postcondition
      as:
        - computer/algorithm/postcondition:
            condition:
              value: "result in input_array AND for all e in input_array: result >= e"
- has:
    step_init:
      type: computer/algorithm/assign
      as:
        - computer/algorithm/assign:
            description:
              value: "initialize result with first element"
            variable:
              value: result
            from:
              value: "input_array[0]"
            next:
              value: step_loop
- has:
    step_loop:
      type: computer/algorithm/indexed/for_each
      as:
        - computer/algorithm/indexed/for_each:
            description:
              value: "iterate over remaining elements"
            index:
              value: i
            from:
              value: 1
            to_length:
              value: input_array
            body:
              value: step_compare
            next:
              value: step_return
- has:
    loop_invariant:
      type: computer/algorithm/invariant
      as:
        - computer/algorithm/invariant:
            condition:
              value: "result in input_array[0..i] AND for all e in input_array[0..i]: result >= e"
- has:
    step_compare:
      type: computer/algorithm/if
      as:
        - computer/algorithm/if:
            description:
              value: "check if current element is greater than result"
            condition_yaml:
              value: |
                math/algebra/operation/greater_than:
                  - input_array[i]
                  - result
            then:
              value: step_update
- has:
    step_update:
      type: computer/algorithm/assign
      as:
        - computer/algorithm/assign:
            description:
              value: "update result with new maximum"
            variable:
              value: result
            from:
              value: "input_array[i]"
- has:
    step_return:
      type: computer/algorithm/return
      as:
        - computer/algorithm/return:
            description:
              value: "return the maximum element"
            variable:
              value: result
