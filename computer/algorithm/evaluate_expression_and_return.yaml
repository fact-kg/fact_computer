- is:
    type: computer/algorithm
- has:
    description:
      type: str
      value: "Evaluate a mathematical expression and return result"
- has:
    expression_fact:
      type: str
- has:
    step_evaluate:
      type: computer/algorithm/evaluate_expression_fact
      as:
        - computer/algorithm/evaluate_expression_fact:
            expression_fact:
              value: expression_fact
            result_variable:
              value: result
            next:
              value: step_return
- has:
    step_return:
      type: computer/algorithm/return
      as:
        - computer/algorithm/return:
            variable:
              value: result
